[project]
name = "agentic-music"
version = "0.0.1"
description = "Agent-executable local music generation studio: YuE2 (default) and MiniMax Music 3 on your own GPU, orchestrated by coding agents."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "agentic-music contributors" }]
dependencies = []

[project.urls]
Upstream-model = "https://huggingface.co/MiniMaxAI/MiniMax-Music3"
Upstream-model-yue2 = "https://huggingface.co/m-a-p/YuE2-3B"

[dependency-groups]
dev = ["ruff>=0.8", "pytest>=8"]

# Pipeline scripts are stdlib-only by design so they can run on either side of
# the WSL boundary without an environment. CLAP scoring is the single
# exception: it runs inside the WSL venv provisioned by scripts/env_setup.sh.

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501", # long lines allowed in docstrings carrying JSON contracts
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
